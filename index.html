shower(x,y,w,h){box(x,y,x+w,y+h,0,2.1,glass,lvG[LV],false)},
plant(x,y){fb(x,y,.4,.4,.4,'#8a5a3a');fb(x+.05,y+.05,.3,.3,.9,'#2f7a4a',.4)},
ward:(x,y,w,h)=>fb(x,y,w,h,2.2,'#8a6a4a'),shelf:(x,y,w,h)=>fb(x,y,w,h,1.9,'#6b4f3a'),gym:(x,y,w,h)=>fb(x,y,w,h,1.1,'#3a3a40'),
desk(x,y,w,h){fb(x,y,w,h,.74,'#8a6a4a');fb(x+w/2-.2,y+h+.1,.4,.4,.5,'#333')}};
function build(R,F,l,st){mkLv(l);
 for(const [n,x,y,w,h,c,t,d] of R){
  box(x,y,x+w,y+h,l?-.4:-.08,0,M(c),lvG[l],t=='p');roomsL[l].push([n,x,y,x+w,y+h]);
  if(t=='p'){box(x-.1,y-.1,x+w+.1,y+h+.1,0,.25,wm,lvG[l],false);box(x+.1,y+.1,x+w-.1,y+h-.1,.02,.27,M('#3aa6d6'),lvG[l],false)}
  if(t=='b'){box(x,y,x+w,y+.06,0,1,glass,lvG[l],true);box(x,y,x+.06,y+h,0,1,glass,lvG[l],true);box(x+w-.06,y,x+w,y+h,0,1,glass,lvG[l],true)}
  if(n!='Passage'&&n!='Courtyard')label(n,x+w/2,y+h/2);
  if((t=='r'||t=='f')&&n!='Staircase')pop(x,y,w,h);
  if(t!='r')continue;
  const dr=(d||'').split(' ').filter(Boolean).map(q=>[q[0],parseFloat(q.slice(1,q.indexOf(':'))),parseFloat(q.slice(q.indexOf(':')+1))]);
  for(const side of 'NSEW'){const hz=side=='N'||side=='S',a0=hz?x:y,len=hz?w:h,fx=side=='N'?y:side=='S'?y+h:side=='W'?x:x+w;
   const gaps=dr.filter(q=>q[0]==side).map(q=>{const c0=a0+q[1]*len;return[c0-q[2]/2,c0+q[2]/2]}).sort((p,q)=>p[0]-q[0]);
   let cur=a0-T/2;const seg=(a,b,li)=>{if(b-a<.05)return;hz?box(a,fx-T/2,b,fx+T/2,li?2.1:0,H,wm,walls,!li):box(fx-T/2,a,fx+T/2,b,li?2.1:0,H,wm,walls,!li)};
   for(const [a,b] of gaps){seg(cur,a);seg(a,b,1);cur=b}seg(cur,a0+len+T/2)}}
 for(const [k,...a] of F)FN[k](...a);
 if(st)for(let i=0;i<12;i++)fb(26.8,14.3-(i+1)*.4,1.4,.4,(i+1)*.28,'#b5a58f')}
build(R,FG,0,1);label('Entrance',13.6,23.4);build(R1,F1,1,1);build(R2,F2,2,0);
function vis(){const lab=blab.getAttribute('aria-pressed')=='true';lvG.forEach((g,i)=>{g.visible=i<=CUR;ceilG[i].visible=(mode=='walk'||ceilOn)&&i==CUR;labelsL[i].visible=mode=='orbit'&&lab&&i==CUR})}
function setLv(n){CUR=n;for(let i=0;i<3;i++)document.getElementById('f'+i).setAttribute('aria-pressed',i==n);if(mode=='walk'){[wx,wz]=SP[n];yaw=0;pit=0}vis();setCam()}
[0,1,2].forEach(i=>document.getElementById('f'+i).onclick=()=>setLv(i));
bcl.onclick=()=>{ceilOn=!ceilOn;bcl.setAttribute('aria-pressed',ceilOn);vis()};


// state
let mode='orbit',az=.5,ph=.8,rad=44,wx=13.6,wz=23,yaw=0,pit=0,jx=0,jy=0;const keys={};
const hint=document.getElementById('hint'),joy=document.getElementById('joy'),knob=document.getElementById('knob'),rn=document.getElementById('room');
function setCam(){if(mode=='orbit'){cam.position.set(CX+rad*Math.sin(ph)*Math.sin(az),rad*Math.cos(ph)+CUR*1.7,CZ+rad*Math.sin(ph)*Math.cos(az));cam.lookAt(CX,CUR*1.7,CZ)}else{cam.position.set(wx,CUR*ST+1.6,wz);cam.rotation.set(pit,yaw,0)}}
function setMode(m){mode=m;bo.setAttribute('aria-pressed',m=='orbit');bw.setAttribute('aria-pressed',m=='walk');joy.style.display=m=='walk'?'block':'none';rn.style.display=m=='walk'?'block':'none';
 hint.textContent=m=='orbit'?'Drag to rotate. Scroll or pinch to zoom.':(matchMedia('(pointer:coarse)').matches?'Left stick to move. Drag anywhere else to look.':'W A S D or arrow keys to move. Drag to look.');
 if(m=='walk'){setW(1);bwall.setAttribute('aria-pressed',true);bwall.textContent='Full walls';[wx,wz]=SP[CUR];yaw=0;pit=0}vis();setCam()}
bo.onclick=()=>setMode('orbit');bw.onclick=()=>setMode('walk');
bwall.onclick=()=>{const full=bwall.getAttribute('aria-pressed')!='true';bwall.setAttribute('aria-pressed',full);bwall.textContent=full?'Full walls':'Low walls';setW(full?1:.12)};
blab.onclick=()=>{const on=blab.getAttribute('aria-pressed')!='true';blab.setAttribute('aria-pressed',on);vis()};
// pointers
const P=new Map();let pd=0;const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size==2){const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointerup',e=>P.delete(e.pointerId));cv.addEventListener('pointercancel',e=>P.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
 if(P.size==2&&mode=='orbit'){const[a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);rad=Math.min(90,Math.max(8,rad*pd/d));pd=d}
 else if(P.size==1){if(mode=='orbit'){az-=dx*.006;ph=Math.min(1.5,Math.max(.12,ph-dy*.006))}else{yaw+=dx*.005;pit=Math.min(1,Math.max(-1,pit+dy*.005))}}setCam()});
cv.addEventListener('wheel',e=>{if(mode=='orbit'){rad=Math.min(90,Math.max(8,rad*(1+e.deltaY*.001)));setCam()}e.preventDefault()},{passive:false});
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let jid=null;const jc=()=>{const r=joy.getBoundingClientRect();return[r.left+60,r.top+60]};
function jm(e){const[cx,cy]=jc();let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy),m=45;if(l>m){dx*=m/l;dy*=m/l}knob.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/m;jy=dy/m}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
const hit=(x,z)=>colL[CUR].some(r=>x>r[0]-.25&&x<r[2]+.25&&z>r[1]-.25&&z<r[3]+.25);
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(mode=='walk'){let f=-jy+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=jx+(keys.d?1:0)-(keys.a?1:0);if(keys.arrowleft)yaw+=dt*1.6;if(keys.arrowright)yaw-=dt*1.6;
  const sp=2.4*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const nx=wx+(fx*f+rx*s)*sp,nz=wz+(fz*f+rz*s)*sp;if(!hit(nx,wz))wx=nx;if(!hit(wx,nz))wz=nz;
  const r=roomsL[CUR].filter(q=>wx>q[1]&&wx<q[3]&&wz>q[2]&&wz<q[4]).pop();rn.textContent=r&&r[0]!='Passage'?r[0]:'';setCam()}
 ren.render(scene,cam)})(last);
setMode('orbit');setLv(2);
